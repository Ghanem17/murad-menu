<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مراد · Murad Restaurant &amp; Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Concept: every dish is a plate seen from above, set on a dark tablecloth; prices are red wax seals */
:root{
  --cloth:#0B1320; --cloth2:#101C2B; --card:#152536; --line:#ffffff12;
  --cream:#F3EEE6; --mute:#8FA1B3; --red:#E0242F; --red2:#A8141D;
  --display:'Reem Kufi','Readex Pro',Tahoma,sans-serif; --body:'Readex Pro',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cloth);color:var(--cream);font-family:var(--body)}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;position:relative}
/* hero: concentric rings like a charger plate */
.hero{position:relative;padding:calc(28px + env(safe-area-inset-top)) 20px 26px;text-align:center;overflow:hidden;
  background:repeating-radial-gradient(circle at 50% -40%,transparent 0 38px,#ffffff06 38px 39px),radial-gradient(90% 70% at 50% 0,#1A2E44,var(--cloth))}
.hero img{width:74px;filter:drop-shadow(0 8px 24px #000a)}
/* sticky plate rail */
.rail{position:sticky;top:0;z-index:5;background:linear-gradient(var(--cloth) 78%,transparent);padding:10px 0 14px}
.rail-in{display:flex;gap:14px;overflow-x:auto;padding:0 18px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail-in::-webkit-scrollbar{display:none}
.cat{flex:none;width:66px;text-align:center;scroll-snap-align:center}
.cat .disc{width:60px;height:60px;margin:0 auto;border-radius:50%;padding:3px;position:relative;transition:transform .3s}
.cat .disc::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px dashed #ffffff30;transition:border-color .3s}
.cat .disc img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.cat span{display:block;font-size:10.5px;color:var(--mute);margin-top:6px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.on .disc{transform:scale(1.08)}
.cat.on .disc::before{border:2px dashed var(--red);animation:spin 9s linear infinite}
.cat.on span{color:var(--cream);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
/* best sellers: big spinning plates */
.best{padding:8px 0 10px}
.best .sec-h{padding:10px 20px 0}
.carousel{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 20px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.big{flex:none;width:58%;scroll-snap-align:center;text-align:center}
.big .plate{width:100%;aspect-ratio:1;border-radius:50%;position:relative;box-shadow:0 30px 50px -20px #000c,0 0 0 8px #ffffff08}
.big .plate img{width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scale(1.35);animation:spin 60s linear infinite}
.big .plate{overflow:hidden}
.big b{display:block;font-size:15px;margin-top:12px}
.big small{color:var(--mute);font-size:12px}
/* sections */
.group{margin:30px 20px 0;display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12px;letter-spacing:2px}
.group::before,.group::after{content:"";flex:1;height:1px;background:var(--line)}
section.sec{padding:0 14px;scroll-margin-top:170px}
.sec-h{padding:22px 6px 0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h3{font-family:var(--display);font-weight:700;font-size:26px;margin:0}
.sec-h em{font-style:normal;color:var(--mute);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.sec-h .n{color:var(--red);font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:56px 12px;padding:62px 0 8px}
.dish{position:relative;background:linear-gradient(170deg,var(--card),var(--cloth2));border:1px solid var(--line);border-radius:22px;padding:84px 12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dish .pl{position:absolute;top:-52px;left:50%;margin-left:-62px;width:124px;height:124px;border-radius:50%;overflow:hidden;box-shadow:0 18px 30px -12px #000d,0 0 0 5px var(--cloth)}
.dish .pl img{width:100%;height:100%;object-fit:cover;transform:scale(1.3);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.dish:active .pl img,.dish:hover .pl img{transform:scale(1.3) rotate(-40deg)}
.dish b{font-size:14.5px;font-weight:600;line-height:1.35}
.dish small{font-size:11px;color:var(--mute)}
.seal{position:absolute;top:38px;inset-inline-end:8px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff4b55,var(--red) 45%,var(--red2));display:grid;place-items:center;text-align:center;line-height:1.05;font-size:11.5px;font-weight:600;box-shadow:0 6px 14px #0008;transform:rotate(-12deg)}
.seal i{display:block;font-style:normal;font-size:8.5px;font-weight:400;opacity:.85}
.seal.ask{font-size:9px}
.sig{order:9;margin-top:6px;font-size:9.5px;color:#fff;background:var(--red2);border-radius:20px;padding:1px 9px}
.dish.nophoto{padding-top:22px}.dish.nophoto .seal{top:-14px}
/* compact (drinks, shisha): small saucers */
.grid.small{grid-template-columns:repeat(3,1fr);gap:46px 10px;padding-top:44px}
.grid.small .dish{padding:56px 6px 10px;border-radius:18px}
.grid.small .pl{width:84px;height:84px;margin-left:-42px;top:-38px}
.grid.small .seal{width:40px;height:40px;font-size:9.5px;top:28px;inset-inline-end:-4px}
.grid.small .seal i{font-size:7.5px}
.grid.small b{font-size:12.5px}
.grid.small small{display:none}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:36px 20px calc(40px + env(safe-area-inset-bottom))}
/* detail: the plate is served */
.veil{position:fixed;inset:0;background:#05090fcc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.serve{position:fixed;inset:auto 0 0;max-width:560px;margin:0 auto;z-index:21;max-height:94svh;overflow-y:auto;scrollbar-width:none;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.serve::-webkit-scrollbar{display:none}
/* the plate arrives spinning as a circle, then opens up into the whole, uncropped photo */
.photo{position:relative;border-radius:22px;overflow:hidden;background:#0B1320;box-shadow:0 30px 50px -20px #000;
  clip-path:circle(30% at 50% 50%);transform:translateY(55vh) rotate(-140deg) scale(.7);
  transition:transform .4s .1s cubic-bezier(.5,0,.75,0),clip-path .25s}
.photo img{display:block;width:100%;height:auto}
.open .photo{transform:none;clip-path:circle(75% at 50% 50%);transition:transform .65s cubic-bezier(.2,.9,.25,1.05),clip-path .55s .5s cubic-bezier(.6,0,.2,1)}
.serve .card{position:relative;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center;transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.serve .card.solo{padding-top:52px}
.serve h4{font-family:var(--display);font-size:26px;margin:0}
.serve .en{color:var(--mute);font-size:13px;margin-top:2px}
.serve .ds{color:#C9D3DC;font-size:14px;line-height:1.7;margin:12px 0 0}
.serve .row{display:flex;align-items:center;justify-content:center;margin-top:18px;gap:10px}
.serve .pr{font-size:22px;font-weight:600}.serve .pr i{font-style:normal;font-size:13px;color:var(--mute);margin-inline-start:4px}
.x{position:absolute;z-index:2;top:12px;inset-inline-start:12px;width:36px;height:36px;border-radius:50%;background:#0B1320b3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;font-size:20px;line-height:1;color:#fff}
.open .veil{opacity:1;pointer-events:auto}
.open .serve{pointer-events:auto}
.open .serve .card{transform:none}
/* search */
[hidden]{display:none!important}
.search{margin:0 18px 12px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:0 8px 0 14px;height:48px;transition:border-color .2s}
.search:focus-within{border-color:var(--red)}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:var(--cream);font:inherit;font-size:15px}
.search input::placeholder{color:var(--mute)}
.search input::-webkit-search-cancel-button{display:none}
.search button{width:32px;height:32px;border-radius:50%;background:#ffffff14;font-size:17px;line-height:1;display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--mute);padding:50px 30px;font-size:15px;line-height:1.8}
.empty b{display:block;color:var(--cream);font-family:var(--display);font-size:22px;margin-bottom:4px}
button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img src="img/logo.png" alt="مراد">
  </header>
  <nav class="rail">
    <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="دوّر على طبق…" autocomplete="off" aria-label="ابحث بالمنيو"><button id="qx" hidden aria-label="امسح البحث">×</button></div>
    <div class="rail-in" id="rail"></div>
  </nav>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>ما لقينا شي بهالاسم</div>
  <div class="foot">الأسعار بالدينار العراقي<br><span dir="ltr">@murad.restaurant</span></div>
</div>
<div class="veil" id="veil"></div>
<div class="serve" id="serve"></div>
<script src="demo/common.js"></script>
<script>
const $ = s => document.querySelector(s), E = MU.esc;
let M;
const GN = {kitchen: 'المطبخ', cafe: 'الكافيه', sweet: 'الحلو والأركيلة', feast: 'ولائم مراد'};
const num = n => Number(n).toLocaleString('en-US'), price = p => p ? num(p) : 'حسب الطلب';
const seal = p => p ? `<span class="seal">${num(p)}<i>د.ع</i></span>` : `<span class="seal ask">حسب<br>الطلب</span>`;
const norm = s => String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/[ىی]/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ');
function dish(it, small) {
  return `<button class="dish${it.i ? '' : ' nophoto'}" data-k="${it.key}" data-q="${E(norm(it.ar + ' ' + it.en + ' ' + it.sec.ar + ' ' + it.sec.en))}">${it.i ? `<span class="pl"><img src="${it.i}" alt="" loading="lazy"></span>` : ''}${seal(it.p)}${it.s && !small ? '<span class="sig">توقيع مراد</span>' : ''}<b>${E(it.ar)}</b><small>${E(it.en)}</small></button>`;
}
function render() {
  $('#rail').innerHTML = `<button class="cat" data-t="best"><span class="disc"><img src="${M.best[0].i}" alt=""></span><span>الأكثر مبيعاً</span></button>` +
    M.sections.map((s, si) => `<button class="cat" data-t="s${si}"><span class="disc"><img src="${s.c}" alt="" loading="lazy"></span><span>${E(s.ar)}</span></button>`).join('');
  let h = `<div class="best" id="best"><div class="sec-h"><div><h3>الأكثر مبيعاً</h3><em>Best Sellers</em></div></div><div class="carousel">` +
    M.best.map(it => `<button class="big" data-k="${it.key}"><span class="plate" style="display:block"><img src="${it.i}" alt=""></span><b>${E(it.ar)}</b><small>${price(it.p)}${it.p ? ' د.ع' : ''}</small></button>`).join('') + '</div></div>';
  let g = '';
  M.sections.forEach((s, si) => {
    if (s.g !== g) { g = s.g; h += `<div class="group">${GN[g]}</div>`; }
    h += `<section class="sec" id="s${si}"><div class="sec-h"><div><h3>${E(s.ar)}</h3><em>${E(s.en)}</em></div></div>
      <div class="grid${s.compact ? ' small' : ''}">${s.items.map(it => dish(it, s.compact)).join('')}</div></section>`;
  });
  $('#list').innerHTML = h;
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => serve(b.dataset.k));
  document.querySelectorAll('.cat').forEach(c => c.onclick = () => { const el = document.getElementById(c.dataset.t); scrollTo({top: el.offsetTop - 165, behavior: 'smooth'}); });
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return;
    document.querySelectorAll('.cat').forEach(c => c.classList.toggle('on', c.dataset.t === e.target.id));
    const on = $('.cat.on'); on && on.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'});
  }), {rootMargin: '-180px 0px -65% 0px'});
  document.querySelectorAll('#best,section.sec').forEach(s => io.observe(s));
}
function serve(k) {
  const it = M.all.find(x => x.key === k);
  const x = '<button class="x" id="x" aria-label="سكّر">×</button>';
  $('#serve').innerHTML = `${it.i ? `<div class="photo">${x}<img src="${it.i}" alt="${E(it.ar)}"></div>` : ''}<div class="card${it.i ? '' : ' solo'}">${it.i ? '' : x}
    <h4>${E(it.ar)}</h4><div class="en">${E(it.en)}، ${E(it.sec.ar)}</div>${it.d ? `<p class="ds">${E(it.d)}</p>` : ''}
    <div class="row"><span class="pr">${price(it.p)}${it.p ? '<i>د.ع</i>' : ''}</span></div></div>`;
  $('#serve').scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('open')));
  $('#x').onclick = close;
}
function search() {
  if (!M) return;
  const q = norm($('#q').value.trim()); let n = 0;
  $('#qx').hidden = !q; $('#best').hidden = !!q; $('.cat[data-t="best"]').hidden = !!q;
  document.querySelectorAll('section.sec').forEach(sec => {
    let c = 0; sec.querySelectorAll('.dish').forEach(d => { const ok = !q || d.dataset.q.includes(q); d.hidden = !ok; if (ok) c++; });
    sec.hidden = !c; n += c; const cat = $(`.cat[data-t="${sec.id}"]`); if (cat) cat.hidden = !c;
  });
  document.querySelectorAll('.group').forEach(g => { let el = g.nextElementSibling, any = false;
    while (el && !el.classList.contains('group')) { if (el.matches('section.sec') && !el.hidden) any = true; el = el.nextElementSibling; } g.hidden = !any; });
  $('#empty').hidden = !q || n > 0;
}
$('#q').addEventListener('input', () => { search(); const top = $('.hero').offsetHeight; if (scrollY > top) scrollTo({top}); });
$('#qx').onclick = () => { $('#q').value = ''; search(); $('#q').focus(); };
function close() { document.body.classList.remove('open'); }
$('#veil').onclick = close;
addEventListener('keydown', e => e.key === 'Escape' && close());
MU.load().then(m => { M = m; render(); });
</script>
</body>
</html>
