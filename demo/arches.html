<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a403a">
<title>قناطر · مراد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* Theme: Golden Hour (themes-pro). Layout: an arcade. Every photo is framed by an arch, like the carved wooden windows in the hall; the rest stays plain so the arches carry the page */
:root{
  --choc:#4a403a; --choc2:#3d3530; --mustard:#f4a900; --terra:#c1666b; --beige:#d4b896; --sand:#efe3d0;
  --display:'El Messiri','Almarai',serif; --body:'Almarai',Tahoma,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--choc);color:var(--sand);font-family:var(--body)}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:540px;margin:0 auto;padding:0 18px}
/* header: the big arch */
.gate{margin:calc(18px + env(safe-area-inset-top)) auto 0;width:min(78%,300px);aspect-ratio:3/3.6;border:1.5px solid var(--beige);border-radius:999px 999px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px 26px;text-align:center;position:relative}
.gate::before{content:"";position:absolute;inset:10px 10px 0;border:1px solid #d4b89655;border-bottom:0;border-radius:999px 999px 0 0}
.gate img{width:86px;margin-bottom:auto;margin-top:34%}
.gate h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1.3}
.gate p{margin:6px 0 0;font-size:13px;color:var(--beige)}
.sill{height:10px;background:var(--choc2);border-top:1.5px solid var(--beige);margin:0 auto;width:min(86%,330px)}
/* arch nav */
.nav{position:sticky;top:0;z-index:5;background:var(--choc);padding:12px 0 10px;margin-top:22px;border-bottom:1px solid #d4b89633}
.nav-in{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scrollbar-width:none;max-width:540px;margin:0 auto}
.nav-in::-webkit-scrollbar{display:none}
.nav button{flex:none;width:58px;text-align:center;font-size:10.5px;color:var(--beige)}
.nav .w{display:block;width:44px;height:54px;margin:0 auto 5px;border-radius:999px 999px 4px 4px;overflow:hidden;border:1.5px solid transparent;transition:border-color .25s}
.nav .w img{width:100%;height:100%;object-fit:cover;display:block}
.nav span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button.on{color:var(--mustard)}.nav button.on .w{border-color:var(--mustard)}
/* sections */
section{scroll-margin-top:96px;padding-top:40px}
.sh{text-align:center;margin-bottom:20px}
.sh h2{font-family:var(--display);font-weight:700;font-size:32px;margin:0;line-height:1.3}
.sh p{margin:2px 0 0;color:var(--beige);font-size:13px}
.group{font-family:var(--display);color:var(--mustard);font-size:20px;text-align:center;margin-top:56px;display:flex;align-items:center;gap:14px}
.group::before,.group::after{content:"";flex:1;height:1px;background:#f4a90055}
.arcade{display:grid;grid-template-columns:1fr 1fr;gap:26px 14px}
.arch{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.arch .win{width:100%;aspect-ratio:3/4;border-radius:999px 999px 6px 6px;overflow:hidden;background:var(--choc2);position:relative;box-shadow:inset 0 0 0 1px #d4b89640}
.arch .win img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.arch:active .win img{transform:scale(1.05)}
.arch b{font-weight:700;font-size:14.5px;line-height:1.4;margin-top:8px}
.arch small{font-size:11.5px;color:var(--beige)}
.arch .p{color:var(--mustard);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.arch .p i{font-style:normal;font-weight:400;font-size:11px;margin-inline-start:3px}
.key{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--terra);color:#fff;font-size:10px;padding:2px 9px;border-radius:10px;white-space:nowrap}
.arch.nowin .win{display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--beige);padding:20px}
.arch.wide{grid-column:span 2}.arch.wide .win{aspect-ratio:16/11}
/* compact: little niches */
.niches{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
.niche{text-align:center;min-width:0}
.niche .w{width:62px;height:76px;margin:0 auto 6px;border-radius:999px 999px 4px 4px;overflow:hidden;box-shadow:inset 0 0 0 1px #d4b89640}
.niche .w img{width:100%;height:100%;object-fit:cover;display:block}
.niche b{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.niche span{color:var(--mustard);font-size:12.5px;font-weight:700}
.end{text-align:center;color:var(--beige);font-size:13px;padding:60px 0 calc(40px + env(safe-area-inset-bottom));line-height:1.9}
/* detail: the window opens */
.dlg{position:fixed;inset:0;z-index:20;background:#2f2824f2;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.dlg.on{opacity:1;pointer-events:auto}
.dlg .in{width:100%;max-width:440px;padding:0 22px calc(26px + env(safe-area-inset-bottom));text-align:center;transform:translateY(40px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.dlg.on .in{transform:none}
.dlg .big{width:76%;margin:0 auto;aspect-ratio:3/4;border-radius:999px 999px 8px 8px;overflow:hidden;border:1.5px solid var(--beige);padding:7px;background:var(--choc)}
.dlg .big img{width:100%;height:100%;object-fit:cover;border-radius:999px 999px 4px 4px;display:block}
.dlg h3{font-family:var(--display);font-size:30px;margin:16px 0 0;line-height:1.25}
.dlg .en{color:var(--beige);font-size:13px}
.dlg .ds{font-size:14px;line-height:1.85;margin:12px auto 0;max-width:36ch;color:var(--sand)}
.dlg .row{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:18px}
.dlg .pp{color:var(--mustard);font-size:24px;font-weight:700}
.dlg .row button{border:1.5px solid var(--sand);border-radius:24px;padding:9px 18px;font-size:13px}
button:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="gate"><img src="img/logo.png" alt="مراد"><h1>أهلاً فيك</h1><p>اختار من ورا الشبابيك</p></div>
  <div class="sill"></div>
</div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<main class="wrap" id="list"></main>
<div class="wrap end">الأسعار بالدينار العراقي<br>@murad.restaurant</div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="in" id="dlgin"></div></div>
<script src="demo/common.js"></script>
<script>
const $ = s => document.querySelector(s), E = MU.esc;
const GN = {kitchen: 'المطبخ', cafe: 'الكافيه', sweet: 'الحلو والأركيلة', feast: 'ولائم مراد'};
let M;
const pr = p => p ? `${MU.num(p)}<i>د.ع</i>` : 'حسب الطلب';
function arch(it, wide) {
  return `<button class="arch${it.i ? '' : ' nowin'}${wide ? ' wide' : ''}" data-k="${it.key}"><span class="win">${it.i ? `<img src="${it.i}" alt="" loading="lazy">` : E(it.ar)}${it.s ? '<span class="key">توقيع مراد</span>' : ''}</span><b>${E(it.ar)}</b><small>${E(it.en)}</small><span class="p">${pr(it.p)}</span></button>`;
}
function render() {
  $('#nav').innerHTML = `<button data-t="best"><span class="w"><img src="${M.best[0].i}" alt=""></span><span>الأكثر طلباً</span></button>` +
    M.sections.map((s, si) => `<button data-t="s${si}"><span class="w"><img src="${s.c}" alt="" loading="lazy"></span><span>${E(s.ar)}</span></button>`).join('');
  let h = `<section id="best"><div class="sh"><h2>الأكثر طلباً</h2><p>اللي بيطلبوه الزباين أكتر شي</p></div><div class="arcade">${M.best.map(it => arch(it)).join('')}</div></section>`, g = '';
  M.sections.forEach((s, si) => {
    if (s.g !== g) { g = s.g; h += `<div class="group">${GN[g]}</div>`; }
    const body = s.compact
      ? `<div class="niches">${s.items.map(it => `<button class="niche" data-k="${it.key}"><span class="w"><img src="${it.i || s.c}" alt="" loading="lazy"></span><b>${E(it.ar)}</b><span>${MU.price(it.p)}</span></button>`).join('')}</div>`
      : `<div class="arcade">${s.items.map((it, k) => arch(it, s.items.length % 2 === 1 && k === s.items.length - 1)).join('')}</div>`;
    h += `<section id="s${si}"><div class="sh"><h2>${E(s.ar)}</h2><p>${E(s.en)}</p></div>${body}</section>`;
  });
  $('#list').innerHTML = h;
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => scrollTo({top: document.getElementById(b.dataset.t).offsetTop - 92, behavior: 'smooth'}));
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => open(b.dataset.k));
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return;
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === e.target.id));
    const on = $('#nav .on'); on && on.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'}); }), {rootMargin: '-110px 0px -70% 0px'});
  document.querySelectorAll('section').forEach(s => io.observe(s));
}
function open(k) {
  const it = M.all.find(x => x.key === k);
  $('#dlgin').innerHTML = `${it.i ? `<div class="big"><img src="${it.i}" alt=""></div>` : ''}<h3>${E(it.ar)}</h3><div class="en">${E(it.en)}</div>${it.d ? `<p class="ds">${E(it.d)}</p>` : ''}
    <div class="row"><span class="pp">${MU.price(it.p)}${it.p ? ' د.ع' : ''}</span><button id="cl">رجوع للمنيو</button></div>`;
  $('#dlg').classList.add('on'); $('#cl').onclick = close; $('#cl').focus();
}
function close() { $('#dlg').classList.remove('on'); }
$('#dlg').onclick = e => { if (e.target.id === 'dlg') close(); };
addEventListener('keydown', e => e.key === 'Escape' && close());
MU.load().then(m => { M = m; render(); });
</script>
</body>
</html>
