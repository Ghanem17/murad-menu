<!doctype html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121B22">
<title>مراد · Murad Restaurant &amp; Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<!-- LANDING: a walk from the street, through the door, into the halls -->
<div id="home">
  <div class="topbar">
    <div class="lang"><button data-l="ar" class="on">ع</button><button data-l="en">EN</button></div>
    <button class="skip" id="skip"><span data-ar="المنيو مباشرة" data-en="Straight to menu"></span> <svg class="flip" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
  <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>

  <!-- 0 · the door -->
  <section class="scene gate" id="gate">
    <video class="bg" src="v/facade.mp4" poster="v/facade.jpg" muted playsinline loop autoplay preload="auto"></video>
    <div class="door left"><div class="slats"></div><div class="half"><img src="img/logo.png" alt=""></div><span class="knob"></span></div>
    <div class="door right"><div class="slats"></div><div class="half"><img src="img/logo.png" alt=""></div><span class="knob"></span></div>
    <div class="gate-ui">
      <div class="eyebrow" data-ar="مطعم وكافيه" data-en="RESTAURANT & CAFE"></div>
      <button class="enter" id="enter"><span class="pulse"></span><b data-ar="تفضّل… فوت" data-en="Step inside"></b></button>
      <div class="tap" data-ar="اكبس على الباب" data-en="Tap the door"></div>
    </div>
  </section>

  <!-- 1 · the facade -->
  <section class="scene" data-step="0">
    <video class="bg" data-src="v/facade2.mp4" poster="v/facade2.jpg" muted playsinline loop preload="none"></video>
    <div class="shade"></div>
    <div class="copy">
      <div class="kicker" data-ar="٠١ · الواجهة" data-en="01 · THE FACADE"></div>
      <h1 data-ar="أهلاً فيك بمراد" data-en="Welcome to Murad"></h1>
      <p data-ar="مطعم وكافيه… وكل زاوية فيه إلها حكاية" data-en="Restaurant &amp; cafe — every corner tells a story"></p>
    </div>
    <div class="scroll-cue"><span></span></div>
  </section>

  <!-- 2 · the entrance -->
  <section class="scene" data-step="1">
    <video class="bg" data-src="v/lounge.mp4" poster="v/lounge.jpg" muted playsinline loop preload="none"></video>
    <div class="shade"></div>
    <div class="copy">
      <div class="kicker" data-ar="٠٢ · المدخل" data-en="02 · THE ENTRANCE"></div>
      <h2 data-ar="من أول خطوة…" data-en="From the very first step…"></h2>
      <p data-ar="الضو دافي، والريحة قهوة، والاستقبال من القلب" data-en="Warm light, the smell of coffee, a heartfelt welcome"></p>
    </div>
  </section>

  <section class="scene" data-step="1">
    <video class="bg" data-src="v/mirror.mp4" poster="v/mirror.jpg" muted playsinline loop preload="none"></video>
    <div class="shade soft"></div>
    <div class="copy quote">
      <h2 class="big" data-ar="«وجودك هنا…<br>خلّى المكان أحلى»" data-en="“Your presence here…<br>makes the place lovelier”"></h2>
    </div>
  </section>

  <!-- 3 · the halls -->
  <section class="scene halls" data-step="2">
    <div class="halls-head">
      <div class="kicker" data-ar="٠٣ · الصالات" data-en="03 · THE HALLS"></div>
      <h2 data-ar="اختار قعدتك" data-en="Pick your corner"></h2>
      <p class="hint2" data-ar="اسحب لتشوف كل الصالات" data-en="Swipe through every hall"></p>
    </div>
    <div class="rail" id="rail"></div>
    <div class="rail-dots" id="raildots"></div>
  </section>

  <!-- 4 · the table -->
  <section class="scene finale" data-step="3">
    <video class="bg" data-src="v/mashrabiya.mp4" poster="v/mashrabiya.jpg" muted playsinline loop preload="none"></video>
    <div class="shade deep"></div>
    <div class="final-in">
      <div class="ring"><img src="img/logo.png" alt="مراد"></div>
      <div class="kicker" data-ar="٠٤ · طاولتك جاهزة" data-en="04 · YOUR TABLE IS READY"></div>
      <h2 data-ar="شو بتحب تطلب اليوم؟" data-en="What are you craving today?"></h2>
      <div class="tiles" id="tiles"></div>
      <button class="cta" id="all" data-ar="تصفّح المنيو كامل" data-en="Browse the full menu"></button>
      <div class="social">
        <a href="https://wa.me/9647860050039" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1a17 17 0 0 1-1.7-.6 13.4 13.4 0 0 1-5.1-4.5c-.4-.5-.9-1.5-.9-2.6s.6-1.6.8-1.9c.2-.2.4-.3.6-.3h.4c.1 0 .3 0 .5.4l.8 1.8c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.5.1.3.6 1 1.3 1.7.9.8 1.7 1.1 2 1.2.2.1.4.1.5-.1l.8-.9c.2-.2.3-.2.5-.1l1.7.8c.3.1.4.2.5.3 0 .1 0 .7-.1 1.4z"/></svg></a>
        <a href="https://www.instagram.com/murad.restaurant/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM12 3.8c2.7 0 3 0 4 .1 2.7.1 3.9 1.4 4 4 .1 1.1.1 1.4.1 4.1s0 3-.1 4c-.1 2.6-1.4 3.9-4 4-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.7-.1-3.9-1.4-4-4C3.8 15 3.8 14.7 3.8 12s0-3 .1-4C4 5.3 5.3 4 8 3.9c1 0 1.3-.1 4-.1zM12 2C9.3 2 8.9 2 7.9 2.1 4.2 2.2 2.2 4.2 2.1 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.1 3.7 2.1 5.7 5.8 5.8 1 .1 1.4.1 4.1.1s3.1 0 4.1-.1c3.7-.1 5.7-2.1 5.8-5.8.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.1-3.7-2.1-5.7-5.8-5.8C15.1 2 14.7 2 12 2z"/></svg></a>
        <a href="https://maps.app.goo.gl/C9WNPrUCrFJtQxcF7" target="_blank" rel="noopener" aria-label="Location"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></a>
      </div>
      <div class="hint" data-ar="الأسعار بالدينار العراقي" data-en="Prices in Iraqi Dinar"></div>
    </div>
  </section>
</div>

<!-- MENU -->
<div id="menu">
  <div class="bar">
    <div class="top">
      <button class="icon" id="back" aria-label="back"><svg class="flip" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <img class="logo" src="img/logo.png" alt="مراد">
      <button class="icon" id="sbtn" aria-label="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="icon" id="lbtn" aria-label="language" style="font-size:13px;font-weight:700"></button>
    </div>
    <div class="search" id="search"><input id="q" type="search" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty" data-ar="ما لقينا شي بهالاسم" data-en="No dishes found"></div>
  <footer><div data-ar="الأسعار بالدينار العراقي" data-en="All prices in Iraqi Dinar (IQD)"></div><div>@murad.restaurant</div></footer>
</div>
</div>
<button class="totop" id="totop" aria-label="top"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>

<script src="js/app.js"></script>
</body>
</html>
