<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1320">
<title>مراد · Murad Restaurant &amp; Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- LANDING: the restaurant film -->
<div id="home">
  <img class="poster" src="v/landing.jpg" alt="">
  <video id="film" src="v/landing.mp4" poster="v/landing.jpg" muted playsinline loop autoplay preload="auto"></video>
  <div class="home-in">
    <div class="lang"><button data-l="ar" class="on">ع</button><button data-l="en">EN</button></div>
    <img class="logo" src="img/logo.png" alt="مراد">
    <button class="enter" id="all" data-ar="تصفّح المنيو كامل" data-en="Browse the full menu"></button>
    <div class="social">
      <a href="https://wa.me/9647860050039" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1a17 17 0 0 1-1.7-.6 13.4 13.4 0 0 1-5.1-4.5c-.4-.5-.9-1.5-.9-2.6s.6-1.6.8-1.9c.2-.2.4-.3.6-.3h.4c.1 0 .3 0 .5.4l.8 1.8c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.5.1.3.6 1 1.3 1.7.9.8 1.7 1.1 2 1.2.2.1.4.1.5-.1l.8-.9c.2-.2.3-.2.5-.1l1.7.8c.3.1.4.2.5.3 0 .1 0 .7-.1 1.4z"/></svg></a>
      <a href="https://www.instagram.com/murad.restaurant/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM12 3.8c2.7 0 3 0 4 .1 2.7.1 3.9 1.4 4 4 .1 1.1.1 1.4.1 4.1s0 3-.1 4c-.1 2.6-1.4 3.9-4 4-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.7-.1-3.9-1.4-4-4C3.8 15 3.8 14.7 3.8 12s0-3 .1-4C4 5.3 5.3 4 8 3.9c1 0 1.3-.1 4-.1zM12 2C9.3 2 8.9 2 7.9 2.1 4.2 2.2 2.2 4.2 2.1 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.1 3.7 2.1 5.7 5.8 5.8 1 .1 1.4.1 4.1.1s3.1 0 4.1-.1c3.7-.1 5.7-2.1 5.8-5.8.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.1-3.7-2.1-5.7-5.8-5.8C15.1 2 14.7 2 12 2z"/></svg></a>
      <a href="https://maps.app.goo.gl/C9WNPrUCrFJtQxcF7" target="_blank" rel="noopener" aria-label="Location"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></a>
    </div>
  </div>
</div>
<!-- MENU -->
<div id="menu">
  <div class="wrap">
    <header class="hero">
      <button class="icon" id="back" aria-label="back"><svg class="flip" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <img class="logo" src="img/logo.png" alt="مراد">
      <button class="icon" id="lbtn" aria-label="language"></button>
    </header>
    <nav class="rail">
      <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off" aria-label="search"><button id="qx" hidden aria-label="clear">×</button></div>
      <div class="rail-in" id="rail"></div>
    </nav>
    <div id="list"></div>
    <div class="empty" id="empty" hidden data-ar="ما لقينا شي بهالاسم" data-en="No dishes found"></div>
    <div class="foot"><div data-ar="الأسعار بالدينار العراقي" data-en="All prices in Iraqi Dinar (IQD)"></div><div dir="ltr">@murad.restaurant</div></div>
  </div>
</div>
<div class="veil" id="veil"></div>
<div class="serve" id="serve" role="dialog" aria-modal="true"></div>
<script src="js/app.js"></script>
</body>
</html>
